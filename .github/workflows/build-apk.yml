name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub's ubuntu runners ship with the Android SDK preinstalled, so we
      # only need to add the NDK (the `android-actions/setup-android` action is
      # deliberately avoided: it tries to install the long-removed `tools`
      # package and fails).
      - name: Install Android NDK
        run: |
          set -e
          SDKMGR="$(command -v sdkmanager || echo "${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager")"
          yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true
          "$SDKMGR" "ndk;26.1.10909125"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/**/Cargo.toml') }}

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version '^3'

      - name: Build native library
        run: |
          export ANDROID_NDK_HOME="${ANDROID_SDK_ROOT}/ndk/26.1.10909125"
          bash scripts/build-native.sh

      # The signing key lives in repository secrets, never in the repo. When it
      # is absent (e.g. a fork), the build falls back to the debug key.
      # (Note: the `secrets` context is not available in a step `if`, so the
      # presence check is done in the shell instead.)
      - name: Prepare signing keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.p12"
            echo "Signing key ready."
          else
            echo "No signing key configured - falling back to debug signing."
          fi

      - name: Build release APK
        working-directory: android
        env:
          SIGNING_STORE_FILE: ${{ runner.temp }}/release.p12
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -PskipRust=true --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: deep-faceswap-android
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
