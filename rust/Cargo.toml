[workspace]
resolver = "2"
members = ["deep_faceswap_core", "deep_faceswap_android"]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Dimitrii (upstream deep_faceswap)", "deep-faceswap-android contributors"]
license = "MIT"

[workspace.dependencies]
# Image processing
image = "0.25"
ndarray = "0.17"

# Utilities
rayon = "1.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }

# Video processing (desktop only; disabled for Android builds)
ffmpeg-next = "8.0.0"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# OpenAPI (optional; used by the desktop API crate)
utoipa = "5.4.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = "symbols"
